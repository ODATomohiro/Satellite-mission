<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>静止衛星打ち上げミッション</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #03050f;
    --bg2: #070b1a;
    --panel: #0b1228;
    --panel2: #0f1935;
    --border: #1a2d5a;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --accent3: #7fff6e;
    --text: #c8d8f8;
    --text-dim: #5a7aaa;
    --success: #7fff6e;
    --warning: #ffcf3f;
    --error: #ff4d6d;
    --glow: 0 0 20px rgba(0,212,255,0.3);
    --glow2: 0 0 30px rgba(0,212,255,0.5);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Starfield */
  #stars {
    position: fixed; top:0; left:0; width:100%; height:100%;
    pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse at 20% 50%, #0a1628 0%, #03050f 70%);
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
  }
  @keyframes twinkle {
    0%,100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  /* Header */
  header {
    position: relative; z-index: 10;
    padding: 24px 40px;
    display: flex; align-items: center; gap: 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(0,212,255,0.03) 0%, transparent 100%);
  }
  .mission-badge {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px; letter-spacing: 3px;
    color: var(--accent); text-transform: uppercase;
    border: 1px solid var(--accent);
    padding: 4px 10px; border-radius: 2px;
    animation: pulse-border 2s ease-in-out infinite;
  }
  @keyframes pulse-border {
    0%,100% { box-shadow: 0 0 6px rgba(0,212,255,0.3); }
    50% { box-shadow: var(--glow2); }
  }
  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(14px, 2.5vw, 22px);
    font-weight: 700;
    letter-spacing: 2px;
    color: white;
  }
  header h1 span { color: var(--accent); }
  .satellite-name {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--accent3);
    border: 1px solid var(--accent3);
    padding: 4px 12px;
    border-radius: 2px;
  }

  /* Layout */
  .app {
    position: relative; z-index: 5;
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: calc(100vh - 70px);
  }

  /* Sidebar */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 24px 0;
    position: sticky; top: 0; height: calc(100vh - 70px);
    overflow-y: auto;
  }
  .sidebar-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 3px;
    color: var(--text-dim); text-transform: uppercase;
    padding: 0 20px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .mission-btn {
    width: 100%;
    background: none; border: none;
    padding: 14px 20px;
    display: flex; align-items: center; gap: 14px;
    cursor: pointer;
    transition: all 0.2s;
    border-left: 3px solid transparent;
    text-align: left;
  }
  .mission-btn:hover { background: rgba(0,212,255,0.05); }
  .mission-btn.active {
    background: rgba(0,212,255,0.08);
    border-left-color: var(--accent);
  }
  .mission-btn.completed { border-left-color: var(--success); }
  .mission-icon {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text-dim);
    flex-shrink: 0;
    transition: all 0.3s;
  }
  .mission-btn.active .mission-icon {
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 10px rgba(0,212,255,0.3);
  }
  .mission-btn.completed .mission-icon {
    border-color: var(--success);
    background: rgba(127,255,110,0.1);
    color: var(--success);
  }
  .mission-label { font-size: 13px; color: var(--text); line-height: 1.4; }
  .mission-sub { font-size: 10px; color: var(--text-dim); font-family: 'Share Tech Mono', monospace; }

  /* Progress Bar */
  .progress-section {
    padding: 20px;
    border-top: 1px solid var(--border);
    margin-top: auto;
  }
  .progress-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; color: var(--text-dim); letter-spacing: 2px;
    margin-bottom: 8px;
    display: flex; justify-content: space-between;
  }
  .progress-bar {
    height: 4px; background: var(--border);
    border-radius: 2px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent3));
    border-radius: 2px; transition: width 0.5s ease;
  }

  /* Main */
  .main {
    padding: 32px 40px;
    overflow-y: auto;
  }

  /* Section Header */
  .section-header {
    display: flex; align-items: flex-start;
    gap: 20px; margin-bottom: 28px;
  }
  .section-number {
    font-family: 'Orbitron', sans-serif;
    font-size: 48px; font-weight: 900;
    color: rgba(0,212,255,0.15);
    line-height: 1;
  }
  .section-info h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px; font-weight: 700;
    color: white; margin-bottom: 4px;
  }
  .section-info p { font-size: 13px; color: var(--text-dim); line-height: 1.7; max-width: 600px; }

  /* Theory Box */
  .theory-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px 24px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .theory-box::before {
    content: '';
    position: absolute; top:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }
  .theory-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; letter-spacing: 3px;
    color: var(--accent); text-transform: uppercase;
    margin-bottom: 12px;
  }
  .theory-box p { font-size: 13px; line-height: 1.8; color: var(--text); }
  .formula {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px 18px;
    margin: 12px 0;
    color: var(--warning);
    text-align: center;
    overflow-x: auto;
  }
  .katex { color: var(--warning); font-size: 1.1em; }
  .katex-display { margin: 0 !important; }
  .katex-display > .katex { color: var(--warning); }
  .step-text .katex { color: var(--text); font-size: 0.95em; }
  .step-text .katex-html { color: var(--text); }
  .theory-box p .katex { color: var(--text); font-size: 0.95em; }
  .result-display .katex { color: inherit; font-size: 0.95em; }

  /* Input Group */
  .input-group {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .input-label {
    font-size: 14px; color: var(--text);
    margin-bottom: 10px; display: flex; align-items: center; gap: 8px;
  }
  .input-label .q-num {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    background: var(--accent);
    color: var(--bg);
    padding: 2px 6px; border-radius: 2px;
  }

  /* Steps reveal */
  .step-row {
    display: flex; align-items: flex-start; gap: 14px;
    margin-bottom: 12px;
    opacity: 0; transform: translateY(10px);
    transition: all 0.4s ease;
  }
  .step-row.visible { opacity: 1; transform: none; }
  .step-num {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px; color: var(--accent);
    background: rgba(0,212,255,0.1);
    border: 1px solid rgba(0,212,255,0.3);
    padding: 3px 8px; border-radius: 2px;
    flex-shrink: 0; margin-top: 3px;
  }
  .step-text { font-size: 13px; line-height: 1.8; color: var(--text); }

  /* Answer Input */
  .answer-row {
    display: flex; gap: 10px; align-items: center;
    margin-top: 16px;
  }
  .answer-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .answer-input:focus { border-color: var(--accent); }
  .answer-input.correct { border-color: var(--success); background: rgba(127,255,110,0.05); }
  .answer-input.incorrect { border-color: var(--error); background: rgba(255,77,109,0.05); }
  .unit-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px; color: var(--text-dim);
    white-space: nowrap;
  }

  /* Buttons */
  .btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px; letter-spacing: 2px;
    padding: 10px 20px;
    border: none; border-radius: 3px;
    cursor: pointer; transition: all 0.2s;
    text-transform: uppercase;
  }
  .btn-primary {
    background: var(--accent);
    color: var(--bg);
  }
  .btn-primary:hover { background: white; box-shadow: var(--glow); }
  .btn-hint {
    background: rgba(255,207,63,0.1);
    border: 1px solid rgba(255,207,63,0.3);
    color: var(--warning);
  }
  .btn-hint:hover { background: rgba(255,207,63,0.2); }
  .btn-next {
    background: rgba(127,255,110,0.1);
    border: 1px solid var(--success);
    color: var(--success);
    width: 100%; margin-top: 20px; padding: 14px;
    font-size: 12px;
    display: none;
  }
  .btn-next.visible { display: block; }
  .btn-next:hover { background: rgba(127,255,110,0.2); box-shadow: 0 0 20px rgba(127,255,110,0.2); }

  /* Result */
  .result-display {
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: 4px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    display: none;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(-5px); } to { opacity:1; transform:none; } }
  .result-display.correct {
    display: block;
    background: rgba(127,255,110,0.08);
    border: 1px solid rgba(127,255,110,0.3);
    color: var(--success);
  }
  .result-display.incorrect {
    display: block;
    background: rgba(255,77,109,0.08);
    border: 1px solid rgba(255,77,109,0.3);
    color: var(--error);
  }
  .result-display.hint {
    display: block;
    background: rgba(255,207,63,0.08);
    border: 1px solid rgba(255,207,63,0.3);
    color: var(--warning);
  }

  /* Orbit Diagram */
  .diagram-container {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px;
    margin-bottom: 24px;
    display: flex; justify-content: center;
  }

  /* Constants Panel */
  .constants-panel {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 14px 18px;
    margin-bottom: 20px;
    display: flex; gap: 24px; flex-wrap: wrap;
  }
  .constant-item {
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
  }
  .constant-item .k { color: var(--text-dim); }
  .constant-item .v { color: var(--warning); }

  /* Mission complete */
  .mission-complete {
    text-align: center;
    padding: 60px 40px;
    animation: fadeIn 0.5s ease;
  }
  .mission-complete .big-icon {
    font-size: 64px; margin-bottom: 20px;
    animation: spin 10s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .mission-complete h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px; color: var(--success);
    margin-bottom: 12px;
    text-shadow: 0 0 30px rgba(127,255,110,0.4);
  }
  .mission-complete p { font-size: 15px; color: var(--text-dim); line-height: 1.8; }

  /* Hint counter */
  .hint-count {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px; color: var(--text-dim);
    margin-left: auto;
  }

  @media (max-width: 768px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { height: auto; position: static; }
    .main { padding: 20px; }
    header { padding: 16px 20px; }
    .section-number { font-size: 32px; }
  }
</style>
</head>
<body>

<div id="stars"></div>

<header>
  <div class="mission-badge">Mission Control</div>
  <h1>静止衛星打ち上げ<span>ミッション</span></h1>
  <div class="satellite-name">🛰 気象衛星『けやき』</div>
</header>

<div class="app">
  <nav class="sidebar">
    <div class="sidebar-title">// MISSION LOG</div>
    <button class="mission-btn active" onclick="showMission(0)" id="btn-0">
      <div class="mission-icon">M1</div>
      <div>
        <div class="mission-label">第1宇宙速度</div>
        <div class="mission-sub">v₀ を求める</div>
      </div>
    </button>
    <button class="mission-btn" onclick="showMission(1)" id="btn-1">
      <div class="mission-icon">M2</div>
      <div>
        <div class="mission-label">静止衛星軌道</div>
        <div class="mission-sub">半径と倍率</div>
      </div>
    </button>
    <button class="mission-btn" onclick="showMission(2)" id="btn-2">
      <div class="mission-icon">M3</div>
      <div>
        <div class="mission-label">楕円軌道投入</div>
        <div class="mission-sub">α の値</div>
      </div>
    </button>
    <button class="mission-btn" onclick="showMission(3)" id="btn-3">
      <div class="mission-icon">M4</div>
      <div>
        <div class="mission-label">B点での速さ</div>
        <div class="mission-sub">β の値</div>
      </div>
    </button>
    <button class="mission-btn" onclick="showMission(4)" id="btn-4">
      <div class="mission-icon">M5</div>
      <div>
        <div class="mission-label">移行時間</div>
        <div class="mission-sub">t_AB を求める</div>
      </div>
    </button>
    <button class="mission-btn" onclick="showMission(5)" id="btn-5">
      <div class="mission-icon">M6</div>
      <div>
        <div class="mission-label">最終加速</div>
        <div class="mission-sub">γ の値</div>
      </div>
    </button>

    <div class="progress-section" style="margin-top:20px">
      <div class="progress-label">
        <span>MISSION PROGRESS</span>
        <span id="progress-text">0 / 6</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>

    <div style="padding: 20px; border-top: 1px solid var(--border); margin-top: 8px;">
      <div style="font-family:'Share Tech Mono',monospace; font-size:9px; color: var(--text-dim); letter-spacing:1px; line-height:1.8;">
        <span style="color:var(--border)">// designed by</span><br>
        <span style="color:var(--accent); letter-spacing:2px;">ODA Tomohiro</span>
      </div>
    </div>
  </nav>

  <main class="main" id="main-content">
    <!-- Populated by JS -->
  </main>
</div>

<script>
// ===== STAR FIELD =====
const starContainer = document.getElementById('stars');
for (let i = 0; i < 150; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2.5 + 0.5;
  s.style.cssText = `
    width:${size}px; height:${size}px;
    left:${Math.random()*100}%;
    top:${Math.random()*100}%;
    --d:${2+Math.random()*4}s;
    --delay:${Math.random()*4}s;
    opacity:${0.2+Math.random()*0.5};
  `;
  starContainer.appendChild(s);
}

// ===== CONSTANTS =====
const g = 9.8, R = 6.4e6;
const Te = 24 * 3600; // 地球自転周期
const v0 = Math.sqrt(g * R); // 第1宇宙速度
const r_geo = Math.pow(g * R * R * Te * Te / (4 * Math.PI * Math.PI), 1/3);
const k = r_geo / R;
// 楕円軌道: A点(r=R), B点(r=r_geo)
const rA = R, rB = r_geo;
const a_ell = (rA + rB) / 2; // 半長軸
// α: A点での速さ = α*v0
// エネルギー保存 + 面積速度保存 → α を求める
// vA*rA = vB*rB → vB = vA*rA/rB
// 0.5*vA^2 - GM/rA = 0.5*vB^2 - GM/rB
// GM = gR^2
// 0.5*vA^2 - gR^2/rA = 0.5*(vA*rA/rB)^2 - gR^2/rB
// vA^2*(0.5 - 0.5*rA^2/rB^2) = gR^2*(1/rA - 1/rB)
// vA^2 = 2gR^2*(1/rA - 1/rB) / (1 - (rA/rB)^2)
const vA = Math.sqrt(2*g*R*R*(1/rA - 1/rB) / (1 - (rA/rB)**2));
const alpha = vA / v0;
const vB = vA * rA / rB;
const beta = vB / v0;
// 楕円周期 T_ell (ケプラー第3法則): T_ell^2/a^3 = Te^2/r_geo^3
// T_ell = Te * (a_ell/r_geo)^(3/2)
const T_ell = Te * Math.pow(a_ell / r_geo, 1.5);
const t_AB = T_ell / 2;
// γ: 静止軌道での速さ = γ*v0
// 静止軌道での速さ v_geo: m*v_geo^2/r_geo = gR^2m/r_geo^2 → v_geo = sqrt(gR^2/r_geo)
const v_geo = Math.sqrt(g * R * R / r_geo);
const gamma = v_geo / v0;

// ===== MISSION DATA =====
const missions = [
  {
    title: "第1宇宙速度 v₀",
    subtitle: "ミッション① — 低軌道周回速度の計算",
    question: "①",
    desc: "地球表面すれすれの円軌道を周回するために必要な速さ ¥¥(v_0¥¥)（第1宇宙速度）を ¥¥(g¥¥)、¥¥(R¥¥) で表し、数値を求めよ。",
    formula: `¥¥dfrac{mv_0^2}{R} = G¥¥dfrac{M_e m}{R^2}`,
    steps: [
      "地表での重力：¥¥(mg = G¥¥dfrac{M_e m}{R^2}¥¥) より ¥¥(GM_e = gR^2¥¥)",
      "円軌道の運動方程式：¥¥(¥¥dfrac{mv_0^2}{R} = G¥¥dfrac{M_e m}{R^2}¥¥)",
      "代入して：¥¥(v_0^2 = gR¥¥)",
      "¥¥(¥¥therefore¥¥; v_0 = ¥¥sqrt{gR}¥¥)"
    ],
    answerFormula: "v_0 = ¥¥sqrt{gR}",
    answerNum: v0,
    unit: "m/s",
    tolerance: 0.03,
    formulaRevealStep: 2,
    hint: `¥¥(g = 9.8¥¥,¥¥mathrm{m/s^2},¥¥; R = 6.4¥¥times10^6¥¥,¥¥mathrm{m}¥¥) を代入してみよう。¥¥[v_0 = ¥¥sqrt{gR} = ¥¥sqrt{9.8 ¥¥times 6.4¥¥times10^6} ¥¥approx¥¥;?¥¥]`,
    diagram: `<svg viewBox="0 0 300 300" width="260" height="260" xmlns="http://www.w3.org/2000/svg">
      <circle cx="150" cy="150" r="60" fill="none" stroke="#1a2d5a" stroke-width="1.5" stroke-dasharray="4,4"/>
      <circle cx="150" cy="150" r="45" fill="#0b1f4a" stroke="#00d4ff" stroke-width="2"/>
      <text x="150" y="155" text-anchor="middle" fill="#00d4ff" font-size="11" font-family="Share Tech Mono">地球 R</text>
      <circle cx="150" cy="90" r="5" fill="#ff6b35"/>
      <text x="163" y="92" fill="#c8d8f8" font-size="10" font-family="Share Tech Mono">衛星</text>
      <path d="M150,90 Q180,120 150,150" stroke="#ff6b35" fill="none" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="185" y="120" fill="#ff6b35" font-size="11" font-family="Share Tech Mono">v₀</text>
      <line x1="155" y1="87" x2="175" y2="80" stroke="#ff6b35" stroke-width="1.5" marker-end="url(#arr)"/>
      <defs><marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ff6b35"/></marker></defs>
      <line x1="150" y1="150" x2="150" y2="90" stroke="#5a7aaa" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="132" y="125" fill="#5a7aaa" font-size="9" font-family="Share Tech Mono">R</text>
    </svg>`
  },
  {

// ===== STATE =====
const state = {
  current: 0,
  completed: new Set(),
  revealed: {} // idx -> 現在表示中のステップ数（最後のstepは除く）
};

// ===== RENDER =====
function showMission(idx) {
  state.current = idx;
  document.querySelectorAll('.mission-btn').forEach((b,i) => {
    b.classList.toggle('active', i === idx);
  });
  renderMission(idx);
}

function renderMission(idx) {
  const m = missions[idx];
  const main = document.getElementById('main-content');
  const done = state.completed.has(idx);

  main.innerHTML = `
    <div class="section-header">
      <div class="section-number">0${idx+1}</div>
      <div class="section-info">
        <h2>${m.title}</h2>
        <p>${m.subtitle}</p>
      </div>
    </div>

    <div class="constants-panel">
      <div class="constant-item"><span class="k">${tex('g')} = </span><span class="v">9.8 m/s²</span></div>
      <div class="constant-item"><span class="k">${tex('R')} = </span><span class="v">6.4×10⁶ m</span></div>
      <div class="constant-item"><span class="k">${tex('T_e')} = </span><span class="v">86400 s</span></div>
      <div class="constant-item"><span class="k">${tex('¥¥pi')} = </span><span class="v">3.14159…</span></div>
      ${idx >= 1 ? `<div class="constant-item"><span class="k">${tex('k')} ≈ </span><span class="v">${k.toFixed(2)}</span></div>` : ''}
      <div class="constant-item"><span class="k">${tex('v_0')} ≈ </span><span class="v">${(v0/1000).toFixed(3)} km/s</span></div>
    </div>

    ${m.diagram ? `<div class="diagram-container">${m.diagram}</div>` : ''}

    <div class="theory-box">
      <div class="theory-title">// 問題 ${m.question}</div>
      <p>${texInline(m.desc)}</p>
      <div class="formula">${tex(m.formula, true)}</div>
    </div>

    <div class="input-group">
      <div class="input-label">
        <span class="q-num">STEP</span>
        解法の手順
        <span class="hint-count" id="hint-count" style="margin-left:auto; font-family:'Share Tech Mono',monospace; font-size:10px; color:var(--text-dim);">
          ${done ? 'SOLVED' : `ヒント: ${getRevealedCount(idx)} / ${m.steps.length - 1} ステップ解放`}
        </span>
      </div>
      ${m.steps.map((s, i) => {
        const isLast = i === m.steps.length - 1;
        const revealed = getRevealedCount(idx);
        const isVisible = done ? true : (isLast ? false : i <= revealed);
        return `
        <div class="step-row ${isVisible ? 'visible' : ''}" id="step-${i}">
          <span class="step-num">STEP ${i+1}</span>
          <span class="step-text">${isLast && !done ? '<span style="color:var(--text-dim);font-style:italic;">— 正解後に表示 —</span>' : texInline(s)}</span>
        </div>`;
      }).join('')}
    </div>

    <div class="input-group" style="margin-bottom:20px;">
      <div style="font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:3px; color:var(--accent); margin-bottom:14px;">// 求める式</div>
      <div style="text-align:center; padding: 10px 0 4px; font-size:1.1em; ${done ? '' : 'display:none;'}" id="answer-formula-label">
        ${tex(m.answerFormula)}
      </div>

      <div style="margin-top:18px; padding-top:16px; border-top: 1px solid var(--border)">
        <div class="input-label" style="margin-bottom:10px;">
          <span class="q-num">ANS</span>
          数値を入力してください
        </div>
        <div class="answer-row">
          <input type="number" class="answer-input ${done ? 'correct' : ''}" id="answer-input"
            placeholder="数値を入力…"
            value="${done ? m.answerNum.toExponential(3) : ''}"
            ${done ? 'disabled' : ''}
          >
          <span class="unit-label">${m.unit ? m.unit : ''}</span>
          <button class="btn btn-hint" onclick="showHint(${idx})" ${done ? 'disabled' : ''}>💡 次のヒント</button>
          <button class="btn btn-primary" onclick="checkAnswer(${idx})" ${done ? 'disabled' : ''}>検証</button>
        </div>
        <div class="result-display ${done ? 'correct' : ''}" id="result-display">
          ${done ? `✅ 正解！ 正確な値: ${formatNum(m.answerNum)}${m.unit ? ' ' + m.unit : ''}${m.answerNum2 ? `　(k ≈ ${m.answerNum2.toFixed(2)})` : ''}` : ''}
        </div>
      </div>
    </div>

    <button class="btn btn-next ${done ? 'visible' : ''}" id="next-btn"
      onclick="${idx < 5 ? `showMission(${idx+1})` : 'showComplete()'}">
      ${idx < 5 ? `▶ NEXT MISSION — ${missions[idx+1].title}` : '🛰 ミッション完全達成！'}
    </button>
  `;

  // Enter key
  const inp = document.getElementById('answer-input');
  if (inp) inp.addEventListener('keydown', e => { if (e.key==='Enter') checkAnswer(idx); });
}

function tex(str, display = false) {
  try {
    return katex.renderToString(str, { throwOnError: false, displayMode: display });
  } catch(e) { return str; }
}

function texInline(str) {
  // テキスト中の ¥(...¥) と ¥[...¥] をkatex.renderToStringで変換
  return str
    .replace(/¥¥¥[(.+?)¥¥¥]/gs, (_, m) => tex(m, true))
    .replace(/¥¥¥((.+?)¥¥¥)/gs, (_, m) => tex(m, false));
}

function getRevealedCount(idx) {
  return state.revealed[idx] || 0;
}

function formatNum(n) {
  if (Math.abs(n) >= 1e5 || (Math.abs(n) < 0.01 && n !== 0)) return n.toExponential(3);
  return n.toFixed(3);
}

function revealNextStep(idx) {
  const m = missions[idx];
  const maxReveal = m.steps.length - 2; // 最後のstep（答え）は除く
  const current = state.revealed[idx] || 0;
  if (current < maxReveal) {
    state.revealed[idx] = current + 1;
    const nextStep = document.getElementById(`step-${current + 1}`);
    if (nextStep) {
      nextStep.querySelector('.step-text').innerHTML = texInline(missions[idx].steps[current + 1]);
      nextStep.classList.add('visible');
    }
    // 求める式の表示タイミング
    if (current + 1 >= missions[idx].formulaRevealStep) {
      const formulaLabel = document.getElementById('answer-formula-label');
      if (formulaLabel && formulaLabel.style.display === 'none') {
        formulaLabel.style.display = '';
        formulaLabel.style.animation = 'fadeIn 0.5s ease';
      }
    }
    // ヒントカウント更新
    const hc = document.getElementById('hint-count');
    if (hc) hc.textContent = `ヒント: ${state.revealed[idx]} / ${maxReveal} ステップ解放`;
  }
}

function toSigFig2(n) {
  if (n === 0) return 0;
  const mag = Math.floor(Math.log10(Math.abs(n)));
  const factor = Math.pow(10, mag - 1);
  return Math.round(n / factor) * factor;
}

function checkAnswer(idx) {
  const m = missions[idx];
  const inp = document.getElementById('answer-input');
  const result = document.getElementById('result-display');
  const val = parseFloat(inp.value);
  if (isNaN(val)) {
    result.className = 'result-display hint';
    result.textContent = '数値を入力してください';
    return;
  }
  if (toSigFig2(val) === toSigFig2(m.answerNum)) {
    inp.className = 'answer-input correct';
    result.className = 'result-display correct';
    result.innerHTML = `✅ 正解！ 正確な値: ${formatNum(m.answerNum)} ${m.unit}${m.answerNum2 ? `　k ≈ ${m.answerNum2.toFixed(2)}` : ''}`;
    state.completed.add(idx);
    document.getElementById(`btn-${idx}`).classList.add('completed');
    document.getElementById(`btn-${idx}`).classList.remove('active');
    document.getElementById('next-btn').classList.add('visible');
    // 最後のステップ（答え）を表示
    const lastStep = document.getElementById(`step-${m.steps.length - 1}`);
    if (lastStep) {
      lastStep.querySelector('.step-text').innerHTML = texInline(m.steps[m.steps.length - 1]);
      lastStep.classList.add('visible');
    }
    const formulaLabel = document.getElementById('answer-formula-label');
    if (formulaLabel && formulaLabel.style.display === 'none') {
      formulaLabel.style.display = '';
      formulaLabel.style.animation = 'fadeIn 0.4s ease';
    }
    updateProgress();
  } else {
    inp.className = 'answer-input incorrect';
    result.className = 'result-display incorrect';
    const rel = Math.abs(val - m.answerNum) / m.answerNum;
    const pct = (rel * 100).toFixed(1);
    const maxReveal = m.steps.length - 2;
    const revealed = state.revealed[idx] || 0;
    const hasMore = revealed < maxReveal;
    result.textContent = `❌ 惜しい！誤差 ${pct}%。${hasMore ? '次のヒントSTEPを解放しました 👇' : 'ヒントをすべて見た？もう一度考えてみよう！'}`;
    revealNextStep(idx);
  }
}

function showHint(idx) {
  const m = missions[idx];
  const maxReveal = m.steps.length - 2;
  const revealed = state.revealed[idx] || 0;
  const result = document.getElementById('result-display');
  if (revealed < maxReveal) {
    revealNextStep(idx);
    result.className = 'result-display hint';
    result.textContent = `💡 STEP ${revealed + 2} を解放しました。式を追って計算してみよう！`;
  } else {
    // 全ステップ解放済み → 数値ヒントを表示
    result.className = 'result-display hint';
    result.innerHTML = `💡 最終ヒント: ${texInline(m.hint)}`;
  }
}

function updateProgress() {
  const n = state.completed.size;
  document.getElementById('progress-text').textContent = `${n} / 6`;
  document.getElementById('progress-fill').style.width = `${n/6*100}%`;
}

function showComplete() {
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="mission-complete">
      <div class="big-icon">🛰</div>
      <h2>MISSION COMPLETE</h2>
      <p>
        気象衛星『けやき』の打ち上げミッション、全段階をクリアしました！<br><br>
        第1宇宙速度 v₀ ≈ <strong>${(v0/1000).toFixed(2)} km/s</strong><br>
        静止衛星軌道半径 r ≈ <strong>${(r_geo/1e6).toFixed(2)}×10⁶ m（地球半径の約 ${k.toFixed(1)} 倍）</strong><br>
        楕円軌道投入: α ≈ <strong>${alpha.toFixed(3)}</strong>、B点速さ: β ≈ <strong>${beta.toFixed(4)}</strong><br>
        移行時間 t_AB ≈ <strong>${(t_AB/3600).toFixed(1)} 時間</strong>、最終加速 γ ≈ <strong>${gamma.toFixed(3)}</strong><br><br>
        <em style="color:var(--accent)">衛星は正常に静止軌道に乗っています。147億円の予算、見事に達成！</em>
      </p>
    </div>
  `;
}

// ===== INIT =====
renderMission(0);
</script>
